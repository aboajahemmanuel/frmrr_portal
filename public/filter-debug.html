<!DOCTYPE html>
<html>
<head>
    <title>Filter Debug Page</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <style>
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            min-width: 150px;
        }
        .filter-group label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .filter-select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .clear-filters-btn {
            align-self: flex-end;
            padding: 8px 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .clear-filters-btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <h1>Filter Debug Page</h1>
    
    <div class="filter-container">
        <div class="filter-group">
            <label for="search-input">Search:</label>
            <input type="text" id="search-input" class="filter-input" placeholder="Search...">
        </div>
        <div class="filter-group">
            <label for="letter-filter">First Letter:</label>
            <select id="letter-filter" class="filter-select">
                <option value="">All Letters</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="year-filter">Year:</label>
            <select id="year-filter" class="filter-select">
                <option value="">All Years</option>
                <option value="2020">2020</option>
                <option value="2021">2021</option>
                <option value="2022">2022</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="effective-date-filter">Effective Date:</label>
            <select id="effective-date-filter" class="filter-select">
                <option value="">All Dates</option>
                <option value="Jan. 1, 2020">Jan. 1, 2020</option>
                <option value="Feb. 15, 2021">Feb. 15, 2021</option>
                <option value="Mar. 3, 2022">Mar. 3, 2022</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="version-filter">Version:</label>
            <select id="version-filter" class="filter-select">
                <option value="">All Versions</option>
                <option value="1.0">1.0</option>
                <option value="1.1">1.1</option>
                <option value="2.0">2.0</option>
            </select>
        </div>
        <div class="filter-group">
            <button id="clear-filters-example" class="clear-filters-btn">Clear Filters</button>
        </div>
    </div>

    <table id="example" class="display" style="width:100%">
        <thead>
            <tr>
                <th>Title</th>
                <th>Version Number</th>
                <th>Issue Date</th>
                <th>Category</th>
                <th>Year</th>
                <th>Effective Date</th>
                <th>Entity</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Document A</td>
                <td>1.0</td>
                <td>Jan. 1, 2020</td>
                <td>Finance</td>
                <td>2020</td>
                <td>Jan. 1, 2020</td>
                <td>Entity A</td>
            </tr>
            <tr>
                <td>Document B</td>
                <td>1.1</td>
                <td>Feb. 15, 2021</td>
                <td>Legal</td>
                <td>2021</td>
                <td>Feb. 15, 2021</td>
                <td>Entity B</td>
            </tr>
            <tr>
                <td>Document C</td>
                <td>2.0</td>
                <td>Mar. 3, 2022</td>
                <td>HR</td>
                <td>2022</td>
                <td>Mar. 3, 2022</td>
                <td>Entity C</td>
            </tr>
        </tbody>
    </table>

    <script>
        $(document).ready(function() {
            // Initialize DataTable
            var table = $('#example').DataTable();
            
            // Add custom filtering functions
            $.fn.dataTable.ext.search.push(
                function(settings, data, dataIndex) {
                    // Effective Date filter
                    var effectiveDateFilter = $('#effective-date-filter').val();
                    var effectiveDateData = data[5]; // Effective Date column
                    
                    if (!effectiveDateFilter || effectiveDateFilter === '') {
                        return true;
                    }
                    
                    return effectiveDateData && effectiveDateData.includes(effectiveDateFilter);
                }
            );
            
            $.fn.dataTable.ext.search.push(
                function(settings, data, dataIndex) {
                    // Version filter
                    var versionFilter = $('#version-filter').val();
                    var versionData = data[1]; // Version column
                    
                    if (!versionFilter || versionFilter === '') {
                        return true;
                    }
                    
                    return versionData && versionData == versionFilter;
                }
            );
            
            // Event listeners for filters
            $('#effective-date-filter, #version-filter').on('change', function() {
                table.draw();
            });
            
            // Clear filters
            $('#clear-filters-example').on('click', function() {
                $('#search-input, #letter-filter, #year-filter, #effective-date-filter, #version-filter').val('');
                table.search('').columns().search('').draw();
            });
            
            console.log('Filters initialized successfully');
        });
    </script>
</body>
</html>
