<!DOCTYPE html>
<html lang="zxx" class="js">
<head>
    <base href="">
    <meta charset="utf-8">
    <meta name="author" content="Softnio">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" href="/public/admin/images/fmdq_favicon.png">
    <title>Exact Replica Test</title>
    <!-- Session timeout configuration -->
    <meta name="session-timeout-minutes" content="30">
    <link href="/public/admin/css/dashlite.css" rel="stylesheet" type="text/css" />
    <link href="/public/admin/css/theme.css" rel="stylesheet" type="text/css" />
    <link href="/public/admin/css/libs/fontawesome-icons.css" rel="stylesheet" type="text/css" />
    <link href="/public/admin/css/libs/themify-icons.css" rel="stylesheet" type="text/css" />
    <!-- Select2 CSS -->
    <link href="/public/assets/libs/select2/css/select2.min.css" rel="stylesheet" type="text/css" />
    
    <meta name="csrf-token" content="test-token">
    
    <style>
        .glass-container {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            margin: 20px;
        }
        
        .search-filters {
            padding: 20px 0;
        }
        
        .sf-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #1d326d;
        }
        
        .search-input {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .w-33 {
            flex: 1;
            min-width: 250px;
        }
        
        .si-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }
        
        .si-input-box {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e9f2;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .si-input-box-s {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e9f2;
            border-radius: 4px;
            font-size: 14px;
            height: 38px;
        }
        
        .btn-flex {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .gradient-buttons {
            flex: 1;
        }
        
        .gradient-button-content {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, #1d326d 0%, #007bff 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .gradient-button-content-white {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            color: #1d326d;
            padding: 12px 20px;
            border: 1px solid #1d326d;
            border-radius: 4px;
            cursor: pointer;
        }
        
        /* Custom Select2 CSS to match existing design */
        .select2-container .select2-selection--single {
            height: 38px !important;
            border: 1px solid #e5e9f2 !important;
            border-radius: 4px !important;
        }
        
        .select2-container .select2-selection--single .select2-selection__rendered {
            line-height: 36px !important;
            padding-left: 12px !important;
            color: #333 !important;
        }
        
        .select2-container .select2-selection--single .select2-selection__arrow {
            height: 36px !important;
        }
    </style>
</head>
<body class="nk-body bg-lighter npc-default has-sidebar ">
    <div class="nk-app-root">
        <div class="nk-main ">
            <div class="glass-container">
                <div class="tab-content">
                    <div class="">
                        <ul class="nav nav-tabs">
                            <li class="active">
                                <a href="#profile-1" data-toggle="tab">Advanced Search</a>
                            </li>
                        </ul>
                        
                        <div class="tab-content text-muted">
                            <div class="tab-pane active" id="profile-1" role="tabpanel">
                                <div class="search-filters">
                                    <br>
                                    <form id="searchFormADFD" method="GET" action="#">
                                        <div class="sf-title">Select one or more options</div>
                                        
                                        <div class="search-input">
                                            <div class="w-33">
                                                <div class="si-title">Entity</div>
                                                <select class="si-input-box-s select2-entity" style="margin-top: 3.5px; width: 100%;" name="entity_id" id="entitySelect">
                                                    <option></option>
                                                    <option value="1">Central Bank of Nigeria</option>
                                                    <option value="2">Securities and Exchange Commission</option>
                                                    <option value="3">National Insurance Commission</option>
                                                    <option value="4">Corporate Affairs Commission</option>
                                                    <option value="5">Federal Inland Revenue Service</option>
                                                    <option value="6">Nigerian Stock Exchange</option>
                                                    <option value="7">Office of the Auditor General</option>
                                                    <option value="8">Federal Ministry of Finance</option>
                                                </select>
                                            </div>

                                            <div class="w-33">
                                                <div class="si-title">Status</div>
                                                <select class="si-input-box-s select2-status" style="margin-top: 3.5px; width: 100%;" name="ceasedRepealed" id="statusSelect">
                                                    <option></option>
                                                    <option value="Active">Active</option>
                                                    <option value="Ceased">Ceased</option>
                                                    <option value="Repealed">Repealed</option>
                                                    <option value="Draft">Draft</option>
                                                    <option value="Pending">Pending</option>
                                                </select>
                                            </div>
                                        </div>
                                        
                                        <div class="btn-flex">
                                            <div class="gradient-buttons">
                                                <button type="button" onclick="clearForm()">
                                                    <div class="gradient-button-content-white">
                                                        <div>Clear Fields</div>
                                                    </div>
                                                </button>
                                            </div>
                                            <div class="gradient-buttons">
                                                <button type="submit">
                                                    <div class="gradient-button-content">
                                                        <div>Search</div>
                                                    </div>
                                                </button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery (needed for select2) -->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    
    <!-- Select2 JS -->
    <script src="/public/assets/libs/select2/js/select2.min.js"></script>

    <script>
        function clearForm() {
            const form = document.getElementById('searchFormADFD');
            
            // Clear all text inputs
            form.querySelectorAll('input[type="text"]').forEach(input => input.value = '');
            
            // Uncheck all checkboxes
            form.querySelectorAll('input[type="checkbox"]').forEach(checkbox => checkbox.checked = false);
            
            // Reset all selects
            form.querySelectorAll('select').forEach(select => {
                select.selectedIndex = 0;
                // Trigger change event for Select2
                if (typeof $(select).select2 !== 'undefined') {
                    $(select).trigger('change.select2');
                }
            });
        }
        
        // Initialize Select2 for type-ahead functionality
        function initializeSelect2() {
            console.log('Initializing Select2...');
            
            // Check if jQuery and Select2 are available
            if (typeof $ === 'undefined') {
                console.error('jQuery is not loaded');
                return;
            }
            
            if (typeof $.fn.select2 === 'undefined') {
                console.error('Select2 is not loaded');
                return;
            }
            
            console.log('jQuery version:', $.fn.jquery);
            console.log('Select2 version:', $.fn.select2.defaults.version);
            
            try {
                // Initialize Select2 for Entity field
                if ($('#entitySelect').length > 0) {
                    $('#entitySelect').select2({
                        placeholder: "Select or type to search entities...",
                        allowClear: true,
                        minimumInputLength: 2,
                        width: '100%'
                    });
                    console.log('Entity Select2 initialized');
                }
                
                // Initialize Select2 for Status field
                if ($('#statusSelect').length > 0) {
                    $('#statusSelect').select2({
                        placeholder: "Select or type to search statuses...",
                        allowClear: true,
                        minimumInputLength: 2,
                        width: '100%'
                    });
                    console.log('Status Select2 initialized');
                }
                
                console.log('All Select2 components initialized successfully');
            } catch (error) {
                console.error('Error initializing Select2:', error);
            }
        }
        
        // Initialize when document is ready
        $(document).ready(function() {
            console.log('Document ready fired');
            initializeSelect2();
        });
        
        // Also initialize after a short delay to ensure all assets are loaded
        setTimeout(initializeSelect2, 2000);
    </script>
</body>
</html>
