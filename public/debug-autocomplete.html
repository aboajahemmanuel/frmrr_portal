<!DOCTYPE html>
<html>
<head>
    <title>Debug Autocomplete</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        .autocomplete-wrapper {
            position: relative;
            margin: 20px 0;
        }
        .si-input-box-s {
            width: calc(100% - 30px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            float: left;
        }
        .dropdown-btn {
            width: 30px;
            height: 38px;
            border: 1px solid #ccc;
            border-left: none;
            border-radius: 0 4px 4px 0;
            background: #f5f5f5;
            cursor: pointer;
            float: right;
        }
        .autocomplete-box {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            width: 100%;
            display: none;
            top: 38px;
            left: 0;
        }
        .autocomplete-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .autocomplete-item:hover {
            background-color: #f0f0f0;
        }
        .debug-info {
            background: #e7f3ff;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Debug Autocomplete</h1>
    
    <div class="debug-info">
        <p>Test: Click on suggestions to see if they populate the input</p>
    </div>
    
    <div class="autocomplete-wrapper">
        <input type="text" id="testInput" class="si-input-box-s" placeholder="Type to search..." autocomplete="off">
        <input type="hidden" id="testHidden">
        <div id="suggestionBox" class="autocomplete-box"></div>
        <button type="button" class="dropdown-btn" id="dropdownBtn">▼</button>
    </div>
    
    <div>
        <h3>Current Values:</h3>
        <p>Input Value: <span id="inputValue">-</span></p>
        <p>Hidden Value: <span id="hiddenValue">-</span></p>
    </div>
    
    <button onclick="updateDisplay()">Update Display</button>
    <button onclick="clearFields()">Clear</button>

    <script>
        // Sample data
        const testData = [
            {id: "1", name: "Apple"},
            {id: "2", name: "Banana"},
            {id: "3", name: "Cherry"},
            {id: "4", name: "Date"},
            {id: "5", name: "Elderberry"}
        ];
        
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('testInput');
            const hidden = document.getElementById('testHidden');
            const suggestionBox = document.getElementById('suggestionBox');
            const dropdownBtn = document.getElementById('dropdownBtn');
            
            // Input event
            input.addEventListener('input', function() {
                const value = this.value.toLowerCase();
                if (value.length >= 1) {
                    const filtered = testData.filter(item => 
                        item.name.toLowerCase().includes(value)
                    );
                    showSuggestions(filtered);
                } else {
                    suggestionBox.style.display = 'none';
                }
            });
            
            // Dropdown button
            dropdownBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (suggestionBox.style.display === 'block') {
                    suggestionBox.style.display = 'none';
                } else {
                    showSuggestions(testData);
                }
            });
            
            // Blur handling
            input.addEventListener('blur', function() {
                setTimeout(() => {
                    // Don't hide if user clicked on a suggestion
                }, 150);
            });
            
            function showSuggestions(suggestions) {
                if (suggestions.length === 0) {
                    suggestionBox.style.display = 'none';
                    return;
                }
                
                suggestionBox.innerHTML = '';
                
                suggestions.forEach(function(suggestion) {
                    const item = document.createElement('div');
                    item.className = 'autocomplete-item';
                    item.textContent = suggestion.name;
                    
                    // FIXED: Proper closure for click handler
                    item.addEventListener('click', function() {
                        console.log('Selecting:', suggestion.name, suggestion.id);
                        input.value = suggestion.name;
                        hidden.value = suggestion.id;
                        suggestionBox.style.display = 'none';
                        input.blur();
                        updateDisplay(); // Update display to show values
                    });
                    
                    suggestionBox.appendChild(item);
                });
                
                suggestionBox.style.display = 'block';
            }
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.autocomplete-wrapper')) {
                    suggestionBox.style.display = 'none';
                }
            });
        });
        
        function updateDisplay() {
            document.getElementById('inputValue').textContent = document.getElementById('testInput').value;
            document.getElementById('hiddenValue').textContent = document.getElementById('testHidden').value;
        }
        
        function clearFields() {
            document.getElementById('testInput').value = '';
            document.getElementById('testHidden').value = '';
            document.getElementById('suggestionBox').style.display = 'none';
            updateDisplay();
        }
    </script>
</body>
</html>
